name: Daily Ad Generation Sync

on:
  schedule:
    - cron: '0 9 * * *'  # 毎日午前9時（UTC）に実行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run sync script
        env:
          AD_GENERATION_EMAIL: ${{ secrets.AD_GENERATION_EMAIL }}
          AD_GENERATION_PASSWORD: ${{ secrets.AD_GENERATION_PASSWORD }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          SERVICE_ACCOUNT_JSON_PATH: ./service_account.json
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
          python ad_generation_sync.py
