name: Daily Ad Generation Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日午前9時（UTC）に実行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests==2.31.0 google-auth==2.26.1 google-api-python-client==2.107.0 pandas==2.1.4 python-dotenv==1.0.0

      - name: List files
        run: ls -la
      
      - name: Run sync script
        env:
          AD_GENERATION_EMAIL: ${{ secrets.AD_GENERATION_EMAIL }}
          AD_GENERATION_PASSWORD: ${{ secrets.AD_GENERATION_PASSWORD }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          SERVICE_ACCOUNT_JSON_PATH: ./service_account.json
        run: |
              python3 << 'PYSCRIPT'
import json
import os
sa_json = os.getenv('SERVICE_ACCOUNT_JSON', '{}')
if sa_json and sa_json != '{}':
    with open('service_account.json', 'w') as f:
        f.write(sa_json)
PYSCRIPT
